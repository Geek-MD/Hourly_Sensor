[mypy]
python_version = 3.14
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
files = custom_components/hourly_sensor

[mypy-homeassistant.*]
ignore_errors = True

[mypy-voluptuous.*]
ignore_errors = True

# The local fallback environment ships Home Assistant 2023 type information;
# these codes cover APIs that are typed in the declared HA 2026.7+ baseline.
[mypy-hourly_sensor.config_flow]
disable_error_code = call-arg

[mypy-hourly_sensor]
disable_error_code = valid-type, attr-defined
